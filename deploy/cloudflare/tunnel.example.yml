# Cloudflare Tunnel for the live demo (copy to ~/.cloudflared/leash.yml, fill TUNNEL_ID).
# cloudflared tunnel login · cloudflared tunnel create leash · cloudflared tunnel route dns [--overwrite-dns] leash <host>
# http2 instead of QUIC: venue Wi-Fi dropped UDP and took the site down for ~20 s (journal #40).
tunnel: <TUNNEL_ID>
credentials-file: /home/<user>/.cloudflared/<TUNNEL_ID>.json
protocol: http2
ingress:
  - hostname: permissionless.in
    service: http://127.0.0.1:3000
  - hostname: www.permissionless.in
    service: http://127.0.0.1:3000
  - hostname: leash.permissionless.in
    service: http://127.0.0.1:3000
  - hostname: facilitator.permissionless.in
    service: http://127.0.0.1:4021
  - hostname: merchant.permissionless.in
    service: http://127.0.0.1:4022
  - service: http_status:404
